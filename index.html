<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADALABE AI - GAMER HUD</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --pink: #ff007f; 
            --blue: #00d2ff; 
            --bg: #05070a; 
            --card: #12161d; 
            --gold: #f0b90b; 
            --green: #00ff88; 
            --neon-glow: 0 0 15px rgba(255, 0, 127, 0.4);
        }

        body { 
            background: var(--bg); 
            /* Effet de grille en arrière-plan */
            background-image: linear-gradient(rgba(0, 210, 255, 0.05) 1px, transparent 1px),
                              linear-gradient(90deg, rgba(0, 210, 255, 0.05) 1px, transparent 1px);
            background-size: 20px 20px;
            color: white; 
            font-family: 'Rajdhani', sans-serif; 
            margin: 0; 
            padding: 10px; 
            display: flex;
            justify-content: center;
        }

        .container { 
            max-width: 420px; 
            width: 100%;
            margin-top: 15px;
            display: none; 
            animation: fadeIn 0.5s ease-out;
        }

        /* Onglets style Gaming */
        .tabs { display: flex; gap: 8px; margin-bottom: 20px; }
        .tab-btn { 
            flex: 1; padding: 14px; border: 1px solid #333; 
            border-radius: 4px; font-weight: bold; 
            font-family: 'Orbitron', sans-serif; font-size: 10px;
            cursor: pointer; background: rgba(30, 35, 41, 0.9); color: #888; 
            transition: 0.3s; text-transform: uppercase;
        }
        .tab-btn.active { 
            background: var(--pink); color: white; 
            border-color: var(--pink); box-shadow: var(--neon-glow);
        }

        /* Sections Cards */
        .section { 
            background: var(--card); border-radius: 15px; padding: 25px; 
            border: 1px solid #2a2f3a; border-left: 4px solid var(--pink);
            display: none; box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }
        .section.active { display: block; }

        .time-now { 
            font-size: 18px; color: var(--blue); margin-bottom: 15px; 
            font-family: 'Orbitron', sans-serif; letter-spacing: 2px;
            text-shadow: 0 0 10px var(--blue);
        }

        .cosmo-display { 
            padding: 30px; border: 1px solid var(--pink); border-radius: 12px; 
            margin: 20px 0; background: rgba(0, 0, 0, 0.6);
            box-shadow: inset 0 0 20px rgba(255, 0, 127, 0.2);
        }

        .prediction-val { 
            font-family: 'Orbitron', sans-serif; font-size: 60px; 
            font-weight: 700; color: var(--pink); 
            text-shadow: 0 0 20px var(--pink); margin: 10px 0;
            animation: pulse 2s infinite;
        }

        /* Boutons Futuristes */
        .btn { 
            width: 100%; padding: 18px; border: none; border-radius: 8px; 
            font-family: 'Orbitron', sans-serif; font-weight: bold; 
            cursor: pointer; font-size: 14px; margin-top: 10px; 
            text-transform: uppercase; letter-spacing: 1px;
            transition: 0.2s;
        }
        .btn:active { transform: scale(0.96); filter: brightness(1.2); }

        input { 
            width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 8px; 
            border: 1px solid #444; background: #080a0d; color: var(--green); 
            font-family: 'Orbitron', sans-serif; text-align: center; font-size: 16px; 
            box-sizing: border-box; 
        }

        .winner-box { 
            margin-top: 20px; padding: 20px; background: #000; 
            border-radius: 8px; border-right: 4px solid var(--green); 
            text-align: left; border-left: 1px solid #333;
        }

        /* Verrouillage */
        #lock { 
            position: fixed; inset: 0; background: var(--bg); 
            z-index: 9999; display: flex; justify-content: center; align-items: center; 
        }
        .lock-panel {
            background: var(--card); padding: 40px; border-radius: 20px; 
            border: 1px solid var(--gold); text-align: center; width: 85%; max-width: 350px;
        }

        @keyframes pulse {
            0% { transform: scale(1); }
            50% { transform: scale(1.03); }
            100% { transform: scale(1); }
        }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div id="lock">
        <div class="lock-panel">
            <h2 style="color:var(--gold); font-family:'Orbitron'; font-size: 16px; letter-spacing: 2px;">ACCESS CONTROL</h2>
            <input type="password" id="pass" placeholder="PASSWORD">
            <button class="btn" style="background:var(--gold); color: black;" onclick="unlock()">INITIALIZE SYSTEM</button>
        </div>
    </div>

    <div id="app" class="container">
        <div class="time-now" id="live-clock">00:00:00</div>
        
        <div class="tabs">
            <button class="tab-btn active" id="tab1" onclick="switchTab(1)">COSMOX HUD</button>
            <button class="tab-btn" id="tab2" onclick="switchTab(2)">MATCH SCAN</button>
        </div>

        <div id="sec1" class="section active">
            <h3 style="color:var(--pink); font-family:'Orbitron'; font-size: 12px; margin:0;">TEMPORAL ANALYSIS</h3>
            <div class="cosmo-display">
                <div id="status" style="font-size:10px; color:var(--gold); letter-spacing: 2px;">SYNC: ONLINE</div>
                <div class="prediction-val" id="val">--.--x</div>
            </div>
            <button class="btn" style="background:var(--pink); color:white; box-shadow: var(--neon-glow);" onclick="predictCosmoTime()">GÉNÉRER SIGNAL</button>
