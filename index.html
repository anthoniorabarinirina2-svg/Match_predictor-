<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADALABE AI - TIME SYNC</title>
    <style>
        :root { --pink: #ff007f; --blue: #00d2ff; --bg: #0b0e11; --card: #1e2329; --gold: #f0b90b; --green: #00ff88; }
        body { background: var(--bg); color: white; font-family: sans-serif; margin: 0; padding: 10px; text-align: center; }
        .container { max-width: 420px; margin: auto; display: none; }
        
        .tabs { display: flex; gap: 5px; margin-bottom: 15px; }
        .tab-btn { flex: 1; padding: 12px; border: none; border-radius: 8px; font-weight: bold; cursor: pointer; background: #1e2329; color: #888; }
        .tab-btn.active { background: var(--pink); color: white; border: 1px solid var(--pink); }

        .section { background: var(--card); border-radius: 20px; padding: 20px; border: 1px solid #333; display: none; }
        .section.active { display: block; }

        .clock-live { font-family: monospace; font-size: 24px; color: var(--blue); margin: 10px 0; text-shadow: 0 0 10px var(--blue); }
        .prediction-val { font-size: 60px; font-weight: bold; color: var(--pink); text-shadow: 0 0 20px var(--pink); margin: 15px 0; }
        
        .btn { width: 100%; padding: 18px; border: none; border-radius: 12px; font-weight: bold; cursor: pointer; font-size: 16px; margin-top: 10px; }
        input { width: 100%; padding: 14px; margin-bottom: 10px; border-radius: 10px; border: 1px solid #444; background: #000; color: #fff; text-align: center; font-size: 16px; box-sizing: border-box; }
        
        .winner-display { margin-top: 20px; padding: 20px; background: #000; border-radius: 12px; border-top: 4px solid var(--green); text-align: left; }
        #lock { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; justify-content: center; align-items: center; }
    </style>
</head>
<body>

    <div id="lock">
        <div style="background:var(--card); padding:30px; border-radius:20px; border:1px solid var(--gold); width:85%;">
            <h2 style="color:var(--gold)">ADALABE SYSTEM</h2>
            <input type="password" id="pass" placeholder="PASSWORD">
            <button class="btn" style="background:var(--gold);" onclick="unlock()">ENTRER</button>
        </div>
    </div>

    <div id="app" class="container">
        <div class="clock-live" id="clock">00:00:00</div>
        
        <div class="tabs">
            <button class="tab-btn active" id="tab1" onclick="switchTab(1)">COSMOX</button>
            <button class="tab-btn" id="tab2" onclick="switchTab(2)">FOOTBALL</button>
        </div>

        <div id="sec1" class="section active">
            <div class="prediction-val" id="cosmo-val">--.--x</div>
            <button class="btn" style="background:var(--pink); color:white;" onclick="predictCosmo()">GÉNÉRER PRÉDICTION</button>
        </div>

        <div id="sec2" class="section">
            <input type="text" id="foot-input" placeholder="Ex: Madagascar vs Egypte">
            <button class="btn" style="background:var(--blue); color:white;" onclick="predictFoot()">NOM DU GAGNANT</button>
            <div id="foot-res"></div>
        </div>
    </div>

    <script>
        setInterval(() => {
            const now = new Date();
            document.getElementById('clock').innerText = now.toLocaleTimeString('fr-FR');
        }, 1000);

        function unlock() {
            if(document.getElementById('pass').value.toLowerCase().trim() === 'adalabe') {
                document.getElementById('lock').style.display = 'none';
                document.getElementById('app').style.display = 'block';
            } else { alert("Code incorrect"); }
        }

        function switchTab(n) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById('tab'+n).classList.add('active');
            document.getElementById('sec'+n).classList.add('active');
        }

        // ALGORITHME TEMPOREL PUR
        function predictCosmo() {
            const display = document.getElementById('cosmo-val');
            const now = new Date();
            const s = now.getSeconds();
            const m = now.getMinutes();
            
            let logic = (s % 2 === 0) ? (2.1 + (s / 4)) : (1.5 + (s / 6) + (m / 10));
            if(logic < 2.00) logic += 2.25; // Force le mode élevé
            
            display.innerText = logic.toFixed(2) + "x";
        }

        function predictFoot() {
            const input = document.getElementById('foot-input').value.trim();
            if(input.length < 3) return;
            const res = document.getElementById('foot-res');
            const m = new Date().getMinutes();
            
            let teams = input.split(/vs|VS|-/);
            let t1 = teams[0].trim();
            let t2 = teams[1] ? teams[1].trim() : t1;

            // Logique minute paire/impaire
            let winName = (m % 2 === 0) ? t1 : t2;

            res.innerHTML = `
                <div class="winner-display">
                    <div style="font-weight:bold; font-size:16px;">${t1} vs ${t2}</div>
                    <div style="color:var(--green); font-size:22px; font-weight:bold; text-transform:uppercase;">GAGNANT : ${winName}</div>
                </div>`;
        }
    </script>
</body>
</html>
