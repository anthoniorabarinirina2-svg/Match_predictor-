<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>AVIATOR IA STRATEGIC</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  background:linear-gradient(135deg,#0a1a33,#3b0a0a);
  color:#eaf6ff;
  font-family:Arial, sans-serif;
}
.app{max-width:440px;margin:auto;padding:15px}
.card{
  background:rgba(10,20,40,0.9);
  border:1px solid #3fa9ff;
  border-radius:12px;
  padding:15px;
  margin-bottom:15px;
}
h2,h3{margin:0 0 10px}
input,button{
  width:100%;
  padding:12px;
  margin-top:8px;
  border-radius:8px;
  border:none;
  font-size:16px;
}
input{
  background:#060c18;
  color:white;
  border:1px solid #ff4b4b;
}
button{
  background:#3fa9ff;
  color:#001;
  font-weight:bold;
  cursor:pointer;
}
button.red{background:#ff4b4b;color:white}
.pred{
  background:#060c18;
  border-left:4px solid #3fa9ff;
  padding:10px;
  margin-top:8px;
}
.good{border-color:#00ff99}
.warn{border-color:#ffd36a}
.bad{border-color:#ff4b4b}
.small{font-size:13px;color:#aaa}
</style>
</head>

<body>
<div class="app">

<div class="card">
<h2>AVIATOR IA – STRATEGIC CORE</h2>
<div class="small">Multi-stratégies • Anti-copie • Auto-learning</div>
</div>

<div class="card">
<input id="h" type="number" placeholder="Heure (0–23)">
<input id="m" type="number" placeholder="Minute (0–59)">
<input id="s" type="number" placeholder="Seconde (0–59)">
<input id="r" type="number" step="0.01" placeholder="Dernier ROSE (≥5x)">
<button onclick="analyser()">ANALYSER</button>
</div>

<div class="card" id="result"></div>

<div class="card">
<button onclick="learn(true)">GAGNÉ ✅</button>
<button class="red" onclick="learn(false)">PERDU ❌</button>
</div>

</div>

<script>
/* ===== MÉMOIRE IA ===== */
let AI = JSON.parse(localStorage.getItem("aviatorAI2")) || {
  w:0,l:0
};

/* ===== ANALYSE ===== */
function analyser(){
  const h=+hEl.value,m=+mEl.value,s=+sEl.value,r=+rEl.value;
  if(
    isNaN(h)||isNaN(m)||isNaN(s)||isNaN(r)||
    h<0||h>23||m<0||m>59||s<0||s>59||r<5
  ){alert("Valeurs invalides");return;}

  let adapt=(AI.w-AI.l)*0.07;

  /* === STRATÉGIE 1 : CYCLE TEMPOREL === */
  let stratTime=(h*7 + m*3 + s)%17;

  /* === STRATÉGIE 2 : RYTHME ROSE === */
  let stratRose=Math.log(r+1)*1.8;

  /* === STRATÉGIE 3 : CHAOS NON LINÉAIRE === */
  let chaos=Math.abs(Math.sin(h+1)*Math.cos(s+1)*3);

  /* === STRATÉGIE 4 : FRICTION MINUTE/SECONDE === */
  let friction=Math.abs(m-s)/30;

  /* === STRATÉGIE 5 : MÉMOIRE IA === */
  let memory=adapt;

  let base=4.2 + stratTime/10 + stratRose + chaos + friction + memory;

  let html="<h3>Prédictions stratégiques</h3>";

  for(let i=1;i<=4;i++){
    let entryM=(m + i*3 + stratTime)%60;
    let entryS=(s + i*13 + Math.floor(chaos*4))%60;

    let spread=0.8 + i*0.35 + Math.abs(Math.sin(s+i));
    let min=(base - spread - i*0.4);
    let max=(base + spread + i*0.6);

    min=Math.max(2,min).toFixed(2);
    max=max.toFixed(2);

    let cls=max>=12?"good":max>=7?"warn":"bad";

    html+=`
    <div class="pred ${cls}">
      ⏱ Entrée : ${entryM}:${entryS.toString().padStart(2,"0")}  
      <br>🎯 Estimation : <b>${min}x → ${max}x</b>
    </div>`;
  }

  /* === JACKPOT (HEURE UNIQUEMENT) === */
  if((h%4===0 && m%10===0) || chaos>2.4){
    html+=`
    <div class="pred good">
      🔥 JACKPOT HAUT POTENTIEL (alignement horaire)
    </div>`;
  }

  result.innerHTML=html;
}

/* ===== AUTO-APPRENTISSAGE ===== */
function learn(win){
  win?AI.w++:AI.l++;
  localStorage.setItem("aviatorAI2",JSON.stringify(AI));
  alert("IA améliorée");
}

/* ===== INPUTS ===== */
const hEl=document.getElementById("h");
const mEl=document.getElementById("m");
const sEl=document.getElementById("s");
const rEl=document.getElementById("r");
</script>

</body>
</html>
