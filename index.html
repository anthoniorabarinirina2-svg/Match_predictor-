
<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ADALABE AI - GAMER SUPREMACY</title>
    <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Rajdhani:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root { 
            --pink: #ff007f; --blue: #00d2ff; --bg: #05070a; 
            --card: rgba(18, 22, 29, 0.95); --gold: #f0b90b; 
            --green: #00ff88; --neon-p: 0 0 20px rgba(255, 0, 127, 0.5);
        }

        body { 
            background: var(--bg); 
            background-image: 
                radial-gradient(circle at 50% 50%, #1a0b16 0%, transparent 70%),
                linear-gradient(rgba(0, 210, 255, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(0, 210, 255, 0.03) 1px, transparent 1px);
            background-size: 100% 100%, 25px 25px, 25px 25px;
            color: white; font-family: 'Rajdhani', sans-serif; 
            margin: 0; padding: 10px; display: flex; justify-content: center; min-height: 100vh;
        }

        .container { max-width: 420px; width: 100%; display: none; animation: slideIn 0.4s ease-out; }

        /* HEADER HUD */
        .hud-header { 
            display: flex; justify-content: space-between; align-items: center;
            background: rgba(255, 255, 255, 0.05); padding: 10px 15px;
            border-radius: 10px; border: 1px solid rgba(255, 255, 255, 0.1); margin-bottom: 15px;
        }
        .clock-live { font-family: 'Orbitron'; font-size: 18px; color: var(--blue); text-shadow: 0 0 10px var(--blue); }

        /* TABS GAMER */
        .tabs { display: flex; gap: 10px; margin-bottom: 20px; }
        .tab-btn { 
            flex: 1; padding: 14px; border: none; font-family: 'Orbitron'; font-size: 10px;
            cursor: pointer; background: #1e2329; color: #666; clip-path: polygon(0 0, 90% 0, 100% 100%, 10% 100%);
            transition: 0.3s; font-weight: bold;
        }
        .tab-btn.active { background: var(--pink); color: white; box-shadow: var(--neon-p); transform: translateY(-2px); }

        /* SECTIONS */
        .section { 
            background: var(--card); border-radius: 20px; padding: 25px; 
            border: 1px solid rgba(255,255,255,0.1); position: relative; display: none;
            box-shadow: 0 15px 35px rgba(0,0,0,0.8);
        }
        .section.active { display: block; }
        .section::before { content: ""; position: absolute; top: 0; left: 20px; width: 40px; height: 3px; background: var(--pink); }

        /* PREDICTION BOX */
        .display-box { 
            padding: 30px 10px; border: 1px solid rgba(255, 0, 127, 0.3); border-radius: 15px;
            background: linear-gradient(180deg, rgba(255, 0, 127, 0.1), transparent); margin: 20px 0;
        }
        .prediction-val { 
            font-family: 'Orbitron'; font-size: 60px; font-weight: bold; 
            color: var(--pink); text-shadow: var(--neon-p); animation: pulse 2s infinite;
        }

        /* BOUTONS STYLÉS */
        .btn { 
            width: 100%; padding: 18px; border: none; border-radius: 12px; 
            font-family: 'Orbitron'; font-weight: bold; cursor: pointer; 
            font-size: 13px; margin-top: 12px; transition: 0.3s;
            text-transform: uppercase; letter-spacing: 1px;
        }
        .btn-main { background: linear-gradient(135deg, var(--pink), #b00058); color: white; box-shadow: var(--neon-p); }
        .btn-blue { background: linear-gradient(135deg, var(--blue), #0088ff); color: black; }
        .btn-util { 
            background: rgba(255,255,255,0.05); color: #888; border: 1px solid #333; 
            padding: 10px; font-size: 9px; width: 48%; margin-top: 20px;
        }
        .btn:active { transform: scale(0.96); filter: brightness(1.3); }

        /* INPUTS */
        input { 
            width: 100%; padding: 15px; margin-bottom: 15px; border-radius: 10px;
            border: 1px solid #333; background: #000; color: var(--green);
            font-family: 'Orbitron'; text-align: center; font-size: 15px;
        }

        .winner-box { 
            margin-top: 20px; padding: 20px; background: rgba(0,0,0,0.5); border-radius: 12px;
            border-left: 4px solid var(--green); text-align: left; animation: fadeIn 0.4s;
        }

        /* LOCK SCREEN */
        #lock { position: fixed; inset: 0; background: var(--bg); z-index: 9999; display: flex; justify-content: center; align-items: center; }
        .lock-card { background: var(--card); padding: 40px; border-radius: 30px; border: 1px solid var(--gold); text-align: center; width: 80%; }

        @keyframes pulse { 0% { opacity: 1; } 50% { opacity: 0.7; } 100% { opacity: 1; } }
        @keyframes slideIn { from { transform: translateY(30px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
        @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
    </style>
</head>
<body>

    <div id="lock">
        <div class="lock-card">
            <h2 style="color:var(--gold); font-family:'Orbitron'; font-size: 14px; margin-bottom: 25px;">CORE ACCESS REQUIRED</h2>
            <input type="password" id="pass" placeholder="PASSWORD">
            <button class="btn btn-main" style="background:var(--gold); color:black;" onclick="unlock()">ENTER SYSTEM</button>
        </div>
    </div>

    <div id="app" class="container">
        <div class="hud-header">
            <div style="font-size: 10px; color: var(--gold); font-family: 'Orbitron';">ADALABE V4.0</div>
            <div class="clock-live" id="clock">00:00:00</div>
        </div>
        
        <div class="tabs">
            <button class="tab-btn active" id="tab1" onclick="switchTab(1)">COSMOX AI</button>
            <button class="tab-btn" id="tab2" onclick="switchTab(2)">FOOT SCAN</button>
        </div>

        <div id="sec1" class="section active">
            <div class="display-box">
                <div id="status" style="font-size:9px; color:var(--gold); letter-spacing: 2px; font-family:'Orbitron';">READY TO PREDICT</div>
                <div class="prediction-val" id="cos-val">--.--x</div>
            </div>
            
            <button class="btn btn-main" onclick="predictCosmo()">GÉNÉRER SIGNAL TEMPOREL</button>
            
            <div style="display: flex; justify-content: space-between;">
                <button class="btn btn-util" onclick="syncServer()">FORCE SYNC</button>
                <button class="btn btn-util" onclick="clearLogs()">CLEAR LOGS</button>
            </div>
        </div>

        <div id="sec2" class="section">
            <input type="text" id="foot-input" placeholder="TEAM 1 VS TEAM 2">
            <button class="btn btn-blue" onclick="predictFoot()">DÉDUIRE GAGNANT</button>
            <div id="foot-res"></div>
        </div>
    </div>

    <script>
        // HORLOGE
        setInterval(() => {
            document.getElementById('clock').innerText = new Date().toLocaleTimeString('fr-FR');
        }, 1000);

        function unlock() {
            if(document.getElementById('pass').value.toLowerCase().trim() === 'adalabe') {
                document.getElementById('lock').style.display = 'none';
                document.getElementById('app').style.display = 'block';
            } else { alert("ACCESS DENIED"); }
        }

        function switchTab(n) {
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.section').forEach(s => s.classList.remove('active'));
            document.getElementById('tab'+n).classList.add('active');
            document.getElementById('sec'+n).classList.add('active');
        }

        // --- ALGORITHME COSMOX ---
        function predictCosmo() {
            const val = document.getElementById('cos-val');
            const stat = document.getElementById('status');
            const now = new Date();
            const m = now.getMinutes();
            const s = now.getSeconds();

            stat.innerText = "ANALYSING T+" + s + "s...";
            val.style.opacity = "0.3";

            setTimeout(() => {
                // Ta logique temporelle
                let logic = (s % 2 === 0) ? (3.10 + (s/5)) : (1.90 + (s/10) + (m/20));
                if(logic < 2.10) logic += 2.25;

                val.innerText = logic.toFixed(2) + "x";
                val.style.opacity = "1";
                stat.innerText = "SIGNAL STABLE - CYCLE DÉTECTÉ";
            }, 600);
        }

        function predictFoot() {
            const input = document.getElementById('foot-input').value.trim();
            if(input.length < 3) return;
            const res = document.getElementById('foot-res');
            const m = new Date().getMinutes();
            
            let teams = input.split(/vs|VS|-/);
            let t1 = teams[0].trim();
            let t2 = teams[1] ? teams[1].trim() : t1;

            let gagnant = (m % 2 === 0) ? t1 : t2;

            res.innerHTML = `
                <div class="winner-box">
                    <div style="font-size:9px; color:var(--blue); font-family:'Orbitron'; margin-bottom:5px;">DATABASE SCAN COMPLETE</div>
                    <div style="font-weight:bold; font-size:16px;">${t1.toUpperCase()} vs ${t2.
