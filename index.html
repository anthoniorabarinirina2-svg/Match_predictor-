<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>AVIATOR IA CLASSIC</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
  margin:0;
  background:#0b1220;
  color:#eaf2ff;
  font-family:Arial, sans-serif;
}
.app{
  max-width:420px;
  margin:auto;
  padding:15px;
}
.card{
  background:#111a2e;
  border:1px solid #1f3b66;
  border-radius:12px;
  padding:15px;
  margin-bottom:15px;
}
h2,h3{margin:0 0 10px 0}
input,button{
  width:100%;
  padding:12px;
  margin-top:8px;
  border-radius:8px;
  border:none;
  font-size:16px;
}
input{
  background:#060c18;
  color:white;
  border:1px solid #2f6fb2;
}
button{
  background:#3fa9ff;
  color:#001;
  font-weight:bold;
  cursor:pointer;
}
button.red{background:#ff5c5c;color:white}
.pred{
  background:#060c18;
  border:1px solid #2f6fb2;
  border-radius:8px;
  padding:10px;
  margin-top:8px;
}
.good{color:#4cff9b}
.warn{color:#ffd36a}
.bad{color:#ff6b6b}
.small{font-size:13px;color:#aaa}
</style>
</head>

<body>
<div class="app">

<div class="card">
<h2>AVIATOR IA – CLASSIC</h2>
<div class="small">Stratégie avancée • Auto-learning</div>
</div>

<div class="card">
<input id="h" type="number" placeholder="Heure (0–23)">
<input id="m" type="number" placeholder="Minute (0–59)">
<input id="s" type="number" placeholder="Seconde (0–59)">
<input id="r" type="number" step="0.01" placeholder="Dernier ROSE (≥5x)">
<button onclick="analyser()">ANALYSER</button>
</div>

<div class="card" id="result"></div>

<div class="card">
<button onclick="learn(true)">GAGNÉ ✅</button>
<button class="red" onclick="learn(false)">PERDU ❌</button>
</div>

</div>

<script>
/* ===== IA MÉMOIRE ===== */
let AI = JSON.parse(localStorage.getItem("aviatorAI")) || {
  score:50,
  win:0,
  lose:0
};

/* ===== ANALYSE ===== */
function analyser(){
  const h=+hEl.value,
        m=+mEl.value,
        s=+sEl.value,
        r=+rEl.value;

  if(
    isNaN(h)||isNaN(m)||isNaN(s)||isNaN(r)||
    h<0||h>23||m<0||m>59||s<0||s>59||r<5
  ){
    alert("Entrées invalides (ROSE ≥ 5x requis)");
    return;
  }

  // LOGIQUES MÉLANGÉES
  let timeMix = (h*3600 + m*60 + s) % 97;
  let chaos = Math.abs(
    Math.sin((r+1)*(m+1)) +
    Math.cos((s+1)*(h+1))
  );

  let base = 4 + (r/3) + (timeMix/100) + chaos;
  let adapt = (AI.win - AI.lose) / 20;

  let html="<h3>Prédictions IA</h3>";

  for(let i=1;i<=4;i++){
    let entryMin = (m + i*2) % 60;
    let entrySec = (s + i*11) % 60;

    let cote =
      base +
      Math.sin((i+s)*r) +
      adapt -
      (i*0.3);

    cote = Math.max(2, cote).toFixed(2);

    let cls = cote>=8?"good":cote>=5?"warn":"bad";

    html+=`
    <div class="pred ${cls}">
      ⏱ Entrée : ${entryMin}:${entrySec.toString().padStart(2,"0")}
      <br>🎯 Cote min : <b>${cote}x</b>
    </div>`;
  }

  // JACKPOT (UTILISE L’HEURE)
  if((h%4===0 && m%10===0) || chaos>2.1){
    html+=`
    <div class="pred good">
      🔥 JACKPOT POSSIBLE (heure favorable)
    </div>`;
  }

  result.innerHTML = html;
}

/* ===== AUTO-APPRENTISSAGE ===== */
function learn(win){
  win?AI.win++:AI.lose++;
  AI.score += win?2:-3;
  AI.score = Math.max(0,Math.min(100,AI.score));
  localStorage.setItem("aviatorAI",JSON.stringify(AI));
  alert("IA mise à jour • Score "+AI.score+"%");
}

/* ===== ALIAS INPUTS ===== */
const hEl=document.getElementById("h");
const mEl=document.getElementById("m");
const sEl=document.getElementById("s");
const rEl=document.getElementById("r");
</script>

</body>
</html>
